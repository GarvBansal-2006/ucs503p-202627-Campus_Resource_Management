services:
  - type: web
    name: campus-resource-management
    env: node
    plan: free
    rootDir: code/backend
    buildCommand: rm -rf node_modules && npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
